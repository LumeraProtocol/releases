name: Bug report
description: Report a problem with a released Lumera SDK, library or service
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - sdk-go
        - sdk-js
        - sdk-rs
        - rq-go
        - rq-library
        - sn-api-server
        - lumescope
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. sdk-go v1.3.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
